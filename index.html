<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>顏料混色器</title>
<style>
  :root{--pad:12px}
  html,body{height:100%;margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:#f6f7fb}
  .wrap{max-width:1000px;margin:0 auto;padding:12px;height:100vh;display:flex;flex-direction:column}

  .result {
    height:240px;border-radius:12px;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.12);position:relative;overflow:hidden;margin-bottom:10px;flex:0 0 auto;
  }
  .icon-row{display:flex;align-items:center;gap:10px;padding:8px;flex:0 0 auto}
  .ctrl-btn{width:44px;height:44px;border-radius:10px;border:0;background:#0ea5a4;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
  .ctrl-btn.trash{background:#2563eb}
  .ctrl-btn.secondary{background:#64748b}

  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-content:start}

  .swatch{
    border-radius:10px;position:relative;touch-action:manipulation;display:flex;align-items:center;justify-content:center;flex-direction:column;transition: transform .18s ease, box-shadow .18s ease;transform-origin:center;cursor:pointer;
    height:70px;overflow:hidden;border:1px solid rgba(0,0,0,0.03);font-size:14px;color:#333;font-weight:600;text-align:center;padding:4px;box-sizing:border-box;
  }
  .swatch .check{display:none;position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:14px;background:rgba(0,0,0,0.35);color:#fff;align-items:center;justify-content:center;font-size:14px}
  .swatch.sel{transform: scale(1.08);box-shadow:0 12px 28px rgba(0,0,0,0.25);outline:3px solid rgba(255,255,255,0.3)}
  .swatch.sel .check{display:flex}
  .swatch:active{transform:scale(0.96)}

  .count{font-weight:600;color:#334155}
  .bubble{position:absolute;width:72px;height:72px;border-radius:50%;pointer-events:none;mix-blend-mode:screen;transform:translate(var(--x),var(--y)) scale(var(--s));opacity:var(--o);transition:transform .8s cubic-bezier(.2,.9,.3,1),opacity .8s}
  .hint{color:#6b7280;font-size:13px;margin-top:8px;text-align:center}

  @media (max-width:900px){
    .grid{grid-template-columns:repeat(4,1fr)}
    .swatch{height:80px;font-size:13px}
    .result{height:200px}
  }
  @media (max-width:520px){
    .grid{grid-template-columns:repeat(3,1fr)}
    .swatch{height:90px;font-size:13px}
    .result{height:180px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="result" class="result" aria-live="polite">
    <div style="position:absolute;right:10px;top:10px;z-index:6">
      <button id="helpBtn" class="ctrl-btn" title="教學">?</button>
    </div>
  </div>

  <div class="icon-row">
    <button id="clearBtn" class="ctrl-btn trash" title="清除" aria-label="清除">🗑</button>
    <div style="flex:1"></div>
    <div id="count" class="count">0</div>
    <div style="width:8px"></div>
    <button id="langBtn" class="ctrl-btn secondary" title="語言切換" aria-label="語言切換">中</button>
  </div>

  <div id="palette" class="grid" style="margin-top:8px"></div>

  <div class="hint" aria-hidden="true">點選顏色，最多選 6 色</div>
</div>

<script>
(() => {
  const palette = [
    {name:'紅',nameEN:'Red',hex:'#E53935'},
    {name:'橙',nameEN:'Orange',hex:'#FB8C00'},
    {name:'黃',nameEN:'Yellow',hex:'#FDD835'},
    {name:'綠',nameEN:'Green',hex:'#43A047'},
    {name:'藍',nameEN:'Blue',hex:'#1E88E5'},
    {name:'紫',nameEN:'Purple',hex:'#8E24AA'},
    {name:'粉',nameEN:'Pink',hex:'#F06292'},
    {name:'棕',nameEN:'Brown',hex:'#8D6E63'},
    {name:'灰',nameEN:'Gray',hex:'#9E9E9E'},
    {name:'白',nameEN:'White',hex:'#FFFFFF'},
    {name:'黑',nameEN:'Black',hex:'#000000'},
    {name:'青',nameEN:'Teal',hex:'#00897B'}
  ];

  const maxSelect = 6;
  const selected = new Set();
  const paletteEl = document.getElementById('palette');
  const resultEl = document.getElementById('result');
  const countEl = document.getElementById('count');
  const helpBtn = document.getElementById('helpBtn');
  const clearBtn = document.getElementById('clearBtn');
  const langBtn = document.getElementById('langBtn');

  let isEnglish = false;

  const speak = (text, lang) => {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang === 'en' ? 'en-US' : 'zh-TW';
      u.rate = lang === 'en' ? 1.0 : 0.8;
      speechSynthesis.speak(u);
    } catch(e){}
  };

  const tap = (() => {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    return ()=>{ 
      try {
        const o = ctx.createOscillator(), g = ctx.createGain(); 
        o.type='sine'; o.frequency.value=880; g.gain.value=0.0001; 
        o.connect(g); g.connect(ctx.destination); 
        o.start(); 
        g.gain.exponentialRampToValueAtTime(0.02, ctx.currentTime + 0.001); 
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12); 
        setTimeout(()=>{ o.stop() }, 160); 
      } catch(e){}
    };
  })();

  function hexToRgb(hex){ const h = hex.replace('#',''); const v = parseInt(h,16); return [(v>>16)&255,(v>>8)&255,v&255].map(x=>x/255); }
  function rgbToCmyk(r,g,b){ const k = 1 - Math.max(r,g,b); if(k>=0.999) return [0,0,0,1]; const c = (1-r-k)/(1-k); const m = (1-g-k)/(1-k); const y = (1-b-k)/(1-k); return [c,m,y,k]; }
  function cmykToRgb(c,m,y,k){ const r=(1-c)*(1-k), g=(1-m)*(1-k), b=(1-y)*(1-k); return [Math.round(r*255),Math.round(g*255),Math.round(b*255)]; }
  function rgbToHex(r,g,b){ return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }

  function isLight(hex){ const [r,g,b] = hexToRgb(hex); const lum = 0.2126*r + 0.7152*g + 0.0722*b; return lum > 0.88; }

  function mixSelected(){
    if(selected.size===0){ resultEl.style.background='#ffffff'; countEl.textContent='0'; return; }
    const ids = Array.from(selected); countEl.textContent = ''+ids.length; const items = ids.map(i=>palette[i]);
    let c=0,m=0,y=0,k=0; for(const it of items){ const [r,g,b] = hexToRgb(it.hex); const [cc,mm,yy,kk] = rgbToCmyk(r,g,b); c+=cc; m+=mm; y+=yy; k+=kk; }
    const n = items.length; const [ac,am,ay,ak] = [c/n,m/n,y/n,k/n]; const [R,G,B] = cmykToRgb(ac,am,ay,ak); const hex = rgbToHex(R,G,B); resultEl.style.background = hex;
  }

  function spawnBubble(colorHex){ const b = document.createElement('div'); b.className='bubble'; b.style.background = colorHex; const rw = resultEl.clientWidth, rh = resultEl.clientHeight; const startX = (Math.random()*rw - rw/2) + 'px'; const startY = (-rh/2 + 20) + 'px'; b.style.setProperty('--x', startX); b.style.setProperty('--y', startY); b.style.setProperty('--s','0.6'); b.style.setProperty('--o','0'); resultEl.appendChild(b); requestAnimationFrame(()=>{ b.style.setProperty('--x','0px'); b.style.setProperty('--y','0px'); b.style.setProperty('--s','1'); b.style.setProperty('--o','0.95'); setTimeout(()=>{ b.style.setProperty('--s','0.6'); b.style.setProperty('--o','0'); b.style.setProperty('--y','10px'); setTimeout(()=>{ b.remove() }, 900); }, 900); }); }

  function toggleIndex(i){ 
    if(selected.has(i)){ selected.delete(i); } 
    else { 
      if(selected.size >= maxSelect) { resultEl.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:220}); return; } 
      selected.add(i); spawnBubble(palette[i].hex); 
    } 
    tap(); 
    const colorName = isEnglish ? palette[i].nameEN : palette[i].name;
    speak(colorName, isEnglish ? 'en' : 'zh');
    updateSwatches(); 
    mixSelected(); 
  }

  function updateSwatches(){ 
    paletteEl.querySelectorAll('.swatch').forEach((el, idx) => { 
      const isSel = selected.has(idx); 
      el.classList.toggle('sel', isSel); 
      el.setAttribute('aria-pressed', isSel ? 'true' : 'false'); 
      const check = el.querySelector('.check'); 
      if (check) check.style.display = isSel ? 'flex' : 'none'; 
    }); 
  }

  palette.forEach((p, idx)=>{ 
    const d = document.createElement('button'); 
    d.className='swatch'; 
    d.style.background = p.hex; 
    if(isLight(p.hex)) d.style.color = '#999'; 
    const displayText = isEnglish ? p.nameEN : p.name;
    d.textContent = displayText;
    d.setAttribute('aria-label', p.name); 
    d.innerHTML += '<div class="check">✓</div>'; 
    d.addEventListener('click', ()=> toggleIndex(idx)); 
    paletteEl.appendChild(d); 
  });

  clearBtn.addEventListener('click', ()=>{ selected.clear(); updateSwatches(); mixSelected(); tap(); });
  helpBtn.addEventListener('click', ()=>{ 
    const msg = isEnglish ? 'Tap a color, pick up to six, see the mix.' : '點選大顏色按鈕，最多選六色。';
    speak(msg, isEnglish ? 'en' : 'zh');
  });

  langBtn.addEventListener('click', ()=>{
    isEnglish = !isEnglish;
    langBtn.textContent = isEnglish ? 'EN' : '中';
    paletteEl.querySelectorAll('.swatch').forEach((el, idx)=>{
      const displayText = isEnglish ? palette[idx].nameEN : palette[idx].name;
      const checkHTML = '<div class="check">✓</div>';
      el.textContent = displayText;
      el.innerHTML += checkHTML;
    });
    const msg = isEnglish ? 'English' : '中文';
    speak(msg, isEnglish ? 'en' : 'zh');
  });

  mixSelected();

})();
</script>
</body>
</html>
