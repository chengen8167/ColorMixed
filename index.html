<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>顏料混色器</title>
<style>
  :root{--pad:12px}
  html,body{height:100%;margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:#f6f7fb}
  .wrap{max-width:1000px;margin:0 auto;padding:12px;height:100vh;display:flex;flex-direction:column}

  .icon-row{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px;flex:0 0 auto}
  .ctrl-btn{width:44px;height:44px;border-radius:10px;border:0;background:#0ea5a4;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:transform .1s}
  .ctrl-btn:active{transform:scale(0.95)}
  .ctrl-btn.trash{background:#2563eb;width:52px;height:52px;font-size:20px}
  .ctrl-btn.secondary{background:#64748b}

  .grid-container{position:relative;width:100%;max-width:650px;aspect-ratio:1/1;margin:40px auto 0;display:flex;align-items:center;justify-content:center;flex:0 1 auto}
  .grid{position:absolute;width:100%;height:100%;top:0;left:0}

  .result {
    position:absolute;width:240px;height:240px;border-radius:50%;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.12);z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;border:none;padding:0;font-family:inherit;transition:transform .2s;
  }
  .result:hover{transform:scale(1.05)}
  .result:active{transform:scale(0.98)}
  .result-label{font-size:12px;color:#6b7280;font-weight:500;margin-top:6px}

  .swatch{
    position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;transition: transform .18s ease, box-shadow .18s ease;transform-origin:center;cursor:pointer;
    width:90px;height:90px;overflow:hidden;border:2px solid rgba(0,0,0,0.08);font-size:16px;color:#333;font-weight:600;text-align:center;padding:0;box-sizing:border-box;
  }
  .swatch .check{display:none;position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,0.35);color:#fff;align-items:center;justify-content:center;font-size:16px}
  .swatch.sel{transform: scale(1.15);box-shadow:0 12px 28px rgba(0,0,0,0.3);outline:4px solid rgba(255,255,255,0.4)}
  .swatch.sel .check{display:flex}
  .swatch:active{transform:scale(1.05)}

  .count{font-weight:600;color:#334155;font-size:18px}
  .bubble{position:absolute;width:72px;height:72px;border-radius:50%;pointer-events:none;mix-blend-mode:screen;transform:translate(var(--x),var(--y)) scale(var(--s));opacity:var(--o);transition:transform .8s cubic-bezier(.2,.9,.3,1),opacity .8s}
  .hint{color:#6b7280;font-size:13px;margin-top:16px;text-align:center;flex:0 0 auto;padding-bottom:12px}

  .ctrl-row-top{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:0}

  @media (max-width:900px){
    .grid-container{max-width:550px;margin:30px auto 0}
    .swatch{width:80px;height:80px;font-size:14px}
    .result{width:200px;height:200px}
  }
  @media (max-width:520px){
    .grid-container{max-width:420px;margin:25px auto 0}
    .swatch{width:70px;height:70px;font-size:12px}
    .result{width:140px;height:140px;font-size:10px}
    .result-label{margin-top:2px}
    .ctrl-btn.trash{width:48px;height:48px;font-size:18px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrl-row-top">
    <button id="clearBtn" class="ctrl-btn trash" title="清除" aria-label="清除">🗑</button>
    <div id="count" class="count">0</div>
    <button id="helpBtn" class="ctrl-btn" title="教學">?</button>
    <button id="langBtn" class="ctrl-btn secondary" title="語言切換" aria-label="語言切換">中</button>
  </div>

  <div class="grid-container">
    <button id="result" class="result" aria-live="polite" title="點擊朗讀混色結果">
      <div class="result-label">混色結果</div>
    </button>
    <div id="palette" class="grid"></div>
  </div>

  <div class="hint" aria-hidden="true">點選顏色，最多選 6 色 • 點擊中間結果聽顏色名稱</div>
</div>

<script>
(() => {
  // 12色色輪排列（色輪自然順序 + 無彩色）
  const palette = [
    {name:'紅',nameEN:'Red',hex:'#E53935'},        // 0: 12點
    {name:'橙',nameEN:'Orange',hex:'#FB8C00'},      // 1: 1點
    {name:'黃',nameEN:'Yellow',hex:'#FDD835'},      // 2: 2點
    {name:'綠',nameEN:'Green',hex:'#43A047'},       // 3: 3點
    {name:'藍',nameEN:'Blue',hex:'#1E88E5'},        // 4: 4點
    {name:'紫',nameEN:'Purple',hex:'#8E24AA'},      // 5: 5點
    {name:'粉紅',nameEN:'Pink',hex:'#F06292'},      // 6: 6點
    {name:'棕色',nameEN:'Brown',hex:'#8D6E63'},     // 7: 7點
    {name:'黑',nameEN:'Black',hex:'#1F1F1F'},       // 8: 8點
    {name:'灰',nameEN:'Gray',hex:'#757575'},        // 9: 9點
    {name:'白',nameEN:'White',hex:'#FFFFFF'},       // 10: 10點
    {name:'青',nameEN:'Cyan',hex:'#00897B'}         // 11: 11點
  ];

  const maxSelect = 6;
  const selected = new Set();
  const paletteEl = document.getElementById('palette');
  const containerEl = document.querySelector('.grid-container');
  const resultEl = document.getElementById('result');
  const countEl = document.getElementById('count');
  const helpBtn = document.getElementById('helpBtn');
  const clearBtn = document.getElementById('clearBtn');
  const langBtn = document.getElementById('langBtn');

  let isEnglish = false;

  const speak = (text, lang) => {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang === 'en' ? 'en-US' : 'zh-TW';
      u.rate = lang === 'en' ? 1.0 : 0.8;
      speechSynthesis.speak(u);
    } catch(e){}
  };

  const tap = (() => {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    return ()=>{ 
      try {
        const o = ctx.createOscillator(), g = ctx.createGain(); 
        o.type='sine'; o.frequency.value=880; g.gain.value=0.0001; 
        o.connect(g); g.connect(ctx.destination); 
        o.start(); 
        g.gain.exponentialRampToValueAtTime(0.02, ctx.currentTime + 0.001); 
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12); 
        setTimeout(()=>{ o.stop() }, 160); 
      } catch(e){}
    };
  })();

  function hexToRgb(hex){ const h = hex.replace('#',''); const v = parseInt(h,16); return [(v>>16)&255,(v>>8)&255,v&255].map(x=>x/255); }
  function rgbToCmyk(r,g,b){ const k = 1 - Math.max(r,g,b); if(k>=0.999) return [0,0,0,1]; const c = (1-r-k)/(1-k); const m = (1-g-k)/(1-k); const y = (1-b-k)/(1-k); return [c,m,y,k]; }
  function cmykToRgb(c,m,y,k){ const r=(1-c)*(1-k), g=(1-m)*(1-k), b=(1-y)*(1-k); return [Math.round(r*255),Math.round(g*255),Math.round(b*255)]; }
  function rgbToHex(r,g,b){ return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }

  function isLight(hex){ const [r,g,b] = hexToRgb(hex); const lum = 0.2126*r + 0.7152*g + 0.0722*b; return lum > 0.88; }

  // 顏色識別函數 - 根據混合結果 HEX 碼識別顏色名稱
  function identifyColor(hex) {
    const [r, g, b] = hexToRgb(hex);
    const lum = 0.2126*r + 0.7152*g + 0.0722*b;
    const h = parseInt(hex.slice(1), 16);
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    const hue = max === min ? 0 : max === r ? ((g - b) / (max - min) * 60 + 360) % 360 : max === g ? ((b - r) / (max - min) * 60 + 120) : ((r - g) / (max - min) * 60 + 240);
    const sat = max === 0 ? 0 : (max - min) / max;
    const bright = max;

    // 無彩色判斷
    if (sat < 0.15) {
      if (bright > 0.9) return isEnglish ? 'White' : '白';
      if (bright < 0.2) return isEnglish ? 'Black' : '黑';
      return isEnglish ? 'Gray' : '灰';
    }

    // 有彩色判斷 - 根據色調角度判斷
    let colorFamily = '';
    if (hue < 15 || hue >= 345) colorFamily = isEnglish ? 'Red' : '紅';
    else if (hue < 45) colorFamily = isEnglish ? 'Orange' : '橙';
    else if (hue < 75) colorFamily = isEnglish ? 'Yellow' : '黃';
    else if (hue < 135) colorFamily = isEnglish ? 'Green' : '綠';
    else if (hue < 195) colorFamily = isEnglish ? 'Cyan' : '青';
    else if (hue < 255) colorFamily = isEnglish ? 'Blue' : '藍';
    else if (hue < 285) colorFamily = isEnglish ? 'Purple' : '紫';
    else if (hue < 315) colorFamily = isEnglish ? 'Pink' : '粉紅';
    else colorFamily = isEnglish ? 'Brown' : '棕色';

    // 亮度調整 - 加上深/淺的描述
    let shade = '';
    if (bright > 0.8 && sat < 0.5) shade = isEnglish ? ' Light' : '淺';
    else if (bright < 0.4) shade = isEnglish ? ' Dark' : '深';
    else if (bright < 0.6) shade = isEnglish ? ' Deep' : '深';

    return colorFamily + shade;
  }

  function mixSelected(){
    if(selected.size===0){ 
      resultEl.style.background='#ffffff'; 
      countEl.textContent='0'; 
      return; 
    }
    const ids = Array.from(selected); 
    countEl.textContent = ''+ids.length; 
    const items = ids.map(i=>palette[i]);
    let c=0,m=0,y=0,k=0; 
    for(const it of items){ 
      const [r,g,b] = hexToRgb(it.hex); 
      const [cc,mm,yy,kk] = rgbToCmyk(r,g,b); 
      c+=cc; m+=mm; y+=yy; k+=kk; 
    }
    const n = items.length; 
    const [ac,am,ay,ak] = [c/n,m/n,y/n,k/n]; 
    const [R,G,B] = cmykToRgb(ac,am,ay,ak); 
    const hex = rgbToHex(R,G,B); 
    resultEl.style.background = hex;
    resultEl.dataset.hex = hex;
  }

  function spawnBubble(colorHex){ 
    const b = document.createElement('div'); 
    b.className='bubble'; 
    b.style.background = colorHex; 
    const rw = resultEl.clientWidth, rh = resultEl.clientHeight; 
    const startX = (Math.random()*rw - rw/2) + 'px'; 
    const startY = (-rh/2 + 20) + 'px'; 
    b.style.setProperty('--x', startX); 
    b.style.setProperty('--y', startY); 
    b.style.setProperty('--s','0.6'); 
    b.style.setProperty('--o','0'); 
    resultEl.appendChild(b); 
    requestAnimationFrame(()=>{ 
      b.style.setProperty('--x','0px'); 
      b.style.setProperty('--y','0px'); 
      b.style.setProperty('--s','1'); 
      b.style.setProperty('--o','0.95'); 
      setTimeout(()=>{ 
        b.style.setProperty('--s','0.6'); 
        b.style.setProperty('--o','0'); 
        b.style.setProperty('--y','10px'); 
        setTimeout(()=>{ b.remove() }, 900); 
      }, 900); 
    }); 
  }

  function toggleIndex(i){ 
    if(selected.has(i)){ selected.delete(i); } 
    else { 
      if(selected.size >= maxSelect) { 
        resultEl.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:220}); 
        return; 
      } 
      selected.add(i); 
      spawnBubble(palette[i].hex); 
    } 
    tap(); 
    const colorName = isEnglish ? palette[i].nameEN : palette[i].name;
    speak(colorName, isEnglish ? 'en' : 'zh');
    updateSwatches(); 
    mixSelected(); 
  }

  function updateSwatches(){ 
    paletteEl.querySelectorAll('.swatch').forEach((el, idx) => { 
      const isSel = selected.has(idx); 
      el.classList.toggle('sel', isSel); 
      el.setAttribute('aria-pressed', isSel ? 'true' : 'false'); 
      const check = el.querySelector('.check'); 
      if (check) check.style.display = isSel ? 'flex' : 'none'; 
    }); 
  }

  // 計算色輪圓形排列位置
  function positionColorsInCircle(){
    const size = containerEl.offsetWidth;
    const center = size / 2;
    const radius = size / 2.4;
    const buttonSize = 90;

    palette.forEach((p, idx)=>{
      const angle = (idx / palette.length) * 2 * Math.PI - Math.PI / 2;
      const x = center + radius * Math.cos(angle) - buttonSize / 2;
      const y = center + radius * Math.sin(angle) - buttonSize / 2;

      const d = document.createElement('button'); 
      d.className='swatch'; 
      d.style.background = p.hex; 
      d.style.left = x + 'px';
      d.style.top = y + 'px';
      if(isLight(p.hex)) d.style.color = '#333'; 
      const displayText = isEnglish ? p.nameEN : p.name;
      d.textContent = displayText;
      d.setAttribute('aria-label', p.name); 
      d.innerHTML += '<div class="check">✓</div>'; 
      d.addEventListener('click', ()=> toggleIndex(idx)); 
      paletteEl.appendChild(d); 
    });
  }

  // 結果視窗點擊朗讀
  resultEl.addEventListener('click', ()=>{
    if(selected.size === 0) return;
    const hex = resultEl.dataset.hex || resultEl.style.background;
    const colorName = identifyColor(hex);
    tap();
    speak(colorName, isEnglish ? 'en' : 'zh');
  });

  clearBtn.addEventListener('click', ()=>{ 
    selected.clear(); 
    updateSwatches(); 
    mixSelected(); 
    tap(); 
  });
  
  helpBtn.addEventListener('click', ()=>{ 
    const msg = isEnglish ? 'Tap a color, pick up to six, see the mix. Click the result to hear the color.' : '點選大顏色按鈕，最多選六色。點擊中間結果聽顏色名稱。';
    speak(msg, isEnglish ? 'en' : 'zh');
  });

  langBtn.addEventListener('click', ()=>{
    isEnglish = !isEnglish;
    langBtn.textContent = isEnglish ? 'EN' : '中';
    paletteEl.querySelectorAll('.swatch').forEach((el, idx)=>{
      const displayText = isEnglish ? palette[idx].nameEN : palette[idx].name;
      const checkHTML = '<div class="check">✓</div>';
      el.textContent = displayText;
      el.innerHTML += checkHTML;
    });
    const msg = isEnglish ? 'English' : '中文';
    speak(msg, isEnglish ? 'en' : 'zh');
  });

  // 初始化
  positionColorsInCircle();
  mixSelected();

})();
</script>
</body>
</html>
